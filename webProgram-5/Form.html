<html>

<head>
 <title>Registration Form</title>
 <link rel=stylesheet href="style.css">

</head>

<body>
	
	<h1>Registration Form </h1>
	
	<form>
	<fieldset>
	<legend>User Information</legend>
	
	<label>Name</label> 
	<select class="cs3">
	
	 <option>Mr.</option>
	 <option>Ms.</option>
	 <option>Miss.</option>
	
	</select>
	<input type="text" required>   <br><br><br>
	
	<label>Phone</label>
	<input type="phone" required>
	
	<label class="cs2">Email</label>
	<input type="email" required>
	
	</fieldset>   
	
	<br> <br>
	
	<label>Address</label>
	<textarea class="cs1" required> </textarea>   <br><br>
	
	<label>Gender</label>
	<input class="cs1" type="radio" name="gender" required><label> Male </label>
	<input class="cs1" type="radio" name="gender" required><label> Female </label>   
	<input class="cs1" type="radio" name="gender" required><label> Others </label>	<br> <br>
	
	<label>Language knowm</label>
	
	<input class="cs2" type="checkbox" required> <label> English </label>
	<input class="cs1" type="checkbox" required> <label> Malayalam </label>
	<input class="cs1" type="checkbox" required> <label> Hindi </label>   <br> <br>
	
	<label>Course</label>
	<select class="cs1">
	 <option>Course</option>
	 <option>BCA</option>
	 <option>BBA</option>
	 <option>MCA</option>
	 <option>MBA</option>
	

	
	</select>  <br> <br>
	
	<div class="button-css">
	 <button> Reset </button> <button type="submit">Submit</button>
	</div>
	
	</form>

</body>

</html>
